<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Vehicle Telemetry</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --surface-panel: #141b2a;
            --border-color: #243044;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-base);
            color: var(--text-primary);
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 8px 14px;
        }

        /* Header */
        header {
            width: 100%;
            max-width: 1720px;
            margin: 0 auto 6px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-title-group h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .segmented-tabs {
            display: inline-flex;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 2px;
            gap: 2px;
        }

        .seg-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .seg-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .seg-btn.active {
            background: var(--surface-panel);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            font-weight: 600;
        }

        /* Metrics Bar */
        .metrics-bar {
            width: 100%;
            max-width: 1720px;
            margin: 0 auto 6px auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }

        .stat-card {
            background: var(--surface-panel);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .stat-row {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-top: 2px;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            font-family: ui-monospace, Consolas, monospace;
        }

        .stat-unit {
            font-size: 10.5px;
            color: var(--text-muted);
        }

        /* Workspace Grid */
        .workspace-grid {
            width: 100%;
            max-width: 1720px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 10px;
            flex: 1;
            min-height: 0;
            margin-bottom: 6px;
        }

        .panel-container {
            background: var(--surface-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .panel-heading h2 {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .cam-viewport {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #000000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cam-viewport img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .bev-viewport {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #080c14;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas#radarCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Radar Target Table */
        .table-container {
            margin-top: 6px;
            height: 85px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #0a0e18;
            flex-shrink: 0;
        }

        .table-container::-webkit-scrollbar {
            width: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10.5px;
            font-family: ui-monospace, Consolas, monospace;
            text-align: left;
        }

        table.data-table th {
            background: #111827;
            color: var(--text-secondary);
            padding: 3px 6px;
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            font-size: 10px;
        }

        table.data-table td {
            padding: 2.5px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        /* Bottom Controls Bar */
        .controls-toolbar {
            width: 100%;
            max-width: 1720px;
            margin: 0 auto;
            background: var(--surface-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-action:hover {
            background: #334155;
        }

        .btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #ffffff;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .scrubber-group {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: var(--accent-blue);
        }

        .frame-indicator {
            font-size: 11px;
            font-family: ui-monospace, Consolas, monospace;
            color: var(--text-secondary);
            min-width: 110px;
            text-align: right;
        }

        .speed-group {
            display: flex;
            align-items: center;
            gap: 2px;
            background: #090d16;
            padding: 2px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .speed-opt {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 3px 6px;
            font-size: 10px;
            font-weight: 500;
            border-radius: 3px;
            cursor: pointer;
        }

        .speed-opt.active {
            background: var(--surface-panel);
            color: var(--text-primary);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="header-title-group">
            <h1>Autonomous Vehicle Telemetry</h1>
        </div>

        <div class="segmented-tabs">
            <button class="seg-btn active" id="tab-d0" onclick="switchDrive('d0')">Drive 0: Urban</button>
            <button class="seg-btn" id="tab-d1" onclick="switchDrive('d1')">Drive 1: Arterial</button>
            <button class="seg-btn" id="tab-d2" onclick="switchDrive('d2')">Drive 2: Highway</button>
        </div>
    </header>

    <!-- Metrics Bar -->
    <div class="metrics-bar">
        <div class="stat-card">
            <span class="stat-label">Speed</span>
            <div class="stat-row">
                <span class="stat-val" id="val-speed">0.0</span>
                <span class="stat-unit">km/h</span>
            </div>
        </div>

        <div class="stat-card">
            <span class="stat-label">Closest Obstacle</span>
            <div class="stat-row">
                <span class="stat-val" id="val-closest">--</span>
                <span class="stat-unit">m</span>
            </div>
        </div>

        <div class="stat-card">
            <span class="stat-label">Time to Collision</span>
            <div class="stat-row">
                <span class="stat-val" id="val-ttc">--</span>
                <span class="stat-unit">s</span>
            </div>
        </div>

        <div class="stat-card">
            <span class="stat-label">Objects</span>
            <div class="stat-row">
                <span class="stat-val" id="val-locks">0</span>
            </div>
        </div>

        <div class="stat-card">
            <span class="stat-label">Steering</span>
            <div class="stat-row">
                <span class="stat-val" id="val-steer">0.0&deg;</span>
            </div>
        </div>
    </div>

    <!-- Workspace -->
    <div class="workspace-grid">
        <!-- Left: Camera View -->
        <div class="panel-container">
            <div class="panel-heading">
                <h2>Camera Vision</h2>
            </div>
            <div class="cam-viewport">
                <img id="cam-img" src="" alt="Camera Feed">
            </div>
        </div>

        <!-- Right: Dynamic BEV Radar Scope -->
        <div class="panel-container">
            <div class="panel-heading">
                <h2>BEV Radar Scope</h2>
            </div>
            <div class="bev-viewport">
                <canvas id="radarCanvas" width="600" height="600"></canvas>
            </div>

            <!-- Target Table -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Class</th>
                            <th>Distance</th>
                            <th>X (m)</th>
                            <th>Y (m)</th>
                            <th>Speed</th>
                            <th>RCS</th>
                        </tr>
                    </thead>
                    <tbody id="radar-tbody">
                        <tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:6px;">No targets</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-toolbar">
        <div class="btn-group">
            <button class="btn-action btn-primary" id="btn-play" onclick="togglePlayback()">Pause</button>
            <button class="btn-action" onclick="stepFrame(-1)">&larr; Prev</button>
            <button class="btn-action" onclick="stepFrame(1)">Next &rarr;</button>
        </div>

        <div class="scrubber-group">
            <input type="range" id="frame-slider" min="0" max="149" value="0" oninput="onScrub(this.value)">
            <span class="frame-indicator" id="frame-counter-txt">Frame 001 / 150</span>
        </div>

        <div class="speed-group">
            <button class="speed-opt" onclick="setSpeed(0.5, this)">0.5x</button>
            <button class="speed-opt active" onclick="setSpeed(1.0, this)">1.0x</button>
            <button class="speed-opt" onclick="setSpeed(2.0, this)">2.0x</button>
        </div>
    </div>

    <!-- Pre-extracted dataset -->
    <script src="dashboard_data.js"></script>

    <script>
        let currentFrameIdx = 0;
        let isPlaying = true;
        let playbackInterval = null;
        let fps = 10.0;
        let speedMultiplier = 1.0;

        // Kinematic Road & Ego Animation State
        let roadScrollMeters = 0.0;
        let lastTimestamp = performance.now();
        let egoLateralM = 0.0;
        let egoHeadingDeg = 0.0;

        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const totalFrames = typeof DASHBOARD_DATA !== 'undefined' ? DASHBOARD_DATA.length : 0;

        window.addEventListener('DOMContentLoaded', () => {
            if (totalFrames === 0) return;
            document.getElementById('frame-slider').max = totalFrames - 1;
            updateDashboard(0);
            startPlayback();
            requestAnimationFrame(animationLoop);
        });

        function switchDrive(driveId) {
            document.querySelectorAll('.seg-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${driveId}`);
            if (activeBtn) activeBtn.classList.add('active');

            let targetIdx = 0;
            if (driveId === 'd1') targetIdx = 50;
            else if (driveId === 'd2') targetIdx = 100;

            updateDashboard(targetIdx);
        }

        function updateDashboard(idx) {
            if (idx < 0) idx = 0;
            if (idx >= totalFrames) idx = totalFrames - 1;
            currentFrameIdx = idx;

            const rec = DASHBOARD_DATA[currentFrameIdx];
            if (!rec) return;

            // 1. Camera Image
            const camImg = document.getElementById('cam-img');
            camImg.src = rec.image_file;

            // 2. Drive Tabs
            document.querySelectorAll('.seg-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${rec.drive}`);
            if (activeTab) activeTab.classList.add('active');

            // 3. Stats
            document.getElementById('val-speed').innerText = rec.ego_speed_kmh.toFixed(1);

            const closestEl = document.getElementById('val-closest');
            if (rec.closest_dist_m !== null) {
                closestEl.innerText = `${rec.closest_dist_m.toFixed(1)} m`;
                closestEl.style.color = rec.closest_dist_m < 15 ? "var(--accent-red)" : (rec.closest_dist_m < 25 ? "var(--accent-amber)" : "var(--text-primary)");
            } else {
                closestEl.innerText = "--";
                closestEl.style.color = "var(--text-primary)";
            }

            document.getElementById('val-locks').innerText = rec.active_locks;

            const ttcEl = document.getElementById('val-ttc');
            if (rec.min_ttc_s !== null) {
                ttcEl.innerText = `${rec.min_ttc_s.toFixed(2)} s`;
                ttcEl.style.color = rec.min_ttc_s < 2.5 ? "var(--accent-red)" : "var(--accent-amber)";
            } else {
                ttcEl.innerText = "Safe";
                ttcEl.style.color = "var(--accent-green)";
            }

            const steerEl = document.getElementById('val-steer');
            const steerVal = rec.steer_deg || 0.0;
            steerEl.innerText = `${steerVal > 0 ? "+" : ""}${steerVal.toFixed(1)}\u00B0`;
            steerEl.style.color = Math.abs(steerVal) > 1.5 ? "var(--accent-amber)" : "var(--accent-green)";

            // 4. Scrubber
            document.getElementById('frame-slider').value = idx;
            document.getElementById('frame-counter-txt').innerText = `Frame ${(idx + 1).toString().padStart(3, '0')} / ${totalFrames}`;

            // 5. Update Target Table
            updateRadarTable(rec.radar_targets);
        }

        function updateRadarTable(targets) {
            const tbody = document.getElementById('radar-tbody');
            tbody.innerHTML = '';
            if (!targets || targets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:6px;">No targets</td></tr>`;
                return;
            }

            targets.forEach((tgt) => {
                const tr = document.createElement('tr');
                const isReceding = tgt.vr >= 0;
                const vrColor = isReceding ? "var(--accent-green)" : "var(--accent-red)";
                const vrSign = isReceding ? `+${tgt.vr.toFixed(1)}` : tgt.vr.toFixed(1);

                const cRaw = (tgt.class || '').toLowerCase();
                let cPretty = 'Car';
                if (cRaw.includes('truck') || cRaw.includes('bus')) cPretty = 'Truck/Bus';
                else if (cRaw.includes('two') || cRaw.includes('bike') || cRaw.includes('motor')) cPretty = 'Two-Wheeler';
                else if (cRaw.includes('pedestrian') || cRaw.includes('person') || cRaw.includes('human')) cPretty = 'Human';
                else if (cRaw.includes('auto')) cPretty = 'Auto';

                tr.innerHTML = `
                    <td style="color:var(--accent-blue); font-weight:600;">#${tgt.id}</td>
                    <td>${cPretty}</td>
                    <td>${tgt.dist.toFixed(1)} m</td>
                    <td>${tgt.x >= 0 ? "+" : ""}${tgt.x.toFixed(1)}</td>
                    <td>${tgt.y >= 0 ? "+" : ""}${tgt.y.toFixed(1)}</td>
                    <td style="color:${vrColor}; font-weight:600;">${vrSign} m/s</td>
                    <td style="color:var(--text-secondary);">${tgt.rcs.toFixed(1)} dBsm</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Smooth 60 FPS Kinematic Animation Loop
        function animationLoop(timestamp) {
            const dtSec = Math.min(0.05, (timestamp - lastTimestamp) / 1000.0);
            lastTimestamp = timestamp;

            const rec = (typeof DASHBOARD_DATA !== 'undefined' && DASHBOARD_DATA.length > 0) ? DASHBOARD_DATA[currentFrameIdx] : null;
            if (rec && isPlaying) {
                const speedMs = (rec.ego_speed_kmh / 3.6) * speedMultiplier;
                roadScrollMeters += speedMs * dtSec;

                // Smooth Ego lateral & heading tracking
                const targetSteer = rec.steer_deg || 0.0;
                egoHeadingDeg += (targetSteer - egoHeadingDeg) * 0.12;

                const targetLateralM = -(targetSteer * 0.35); // lateral evasion displacement
                egoLateralM += (targetLateralM - egoLateralM) * 0.12;
            }

            renderDynamicBEV(rec);
            requestAnimationFrame(animationLoop);
        }

        function renderDynamicBEV(rec) {
            const W = canvas.width;
            const H = canvas.height;
            ctx.clearRect(0, 0, W, H);

            const u0 = W / 2;
            const v0 = H * 0.80;
            const scale = 7.2; // pixels per meter

            // Road Corridor
            const roadHalfWidthM = 7.0;
            const roadLeft = u0 - roadHalfWidthM * scale;
            const roadRight = u0 + roadHalfWidthM * scale;

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(roadLeft, 0, roadRight - roadLeft, H);

            // Road Outer Curb Boundaries
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(roadLeft, 0); ctx.lineTo(roadLeft, H);
            ctx.moveTo(roadRight, 0); ctx.lineTo(roadRight, H);
            ctx.stroke();

            // Dynamic Scrolling Lane Lines (flows with vehicle speed)
            const dashPeriodM = 6.0;
            const dashOffsetPx = (roadScrollMeters % dashPeriodM) * scale;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([12, 16]);
            ctx.lineDashOffset = -dashOffsetPx;

            [-3.5, 3.5].forEach(yLane => {
                const uLane = u0 - yLane * scale;
                ctx.beginPath();
                ctx.moveTo(uLane, 0); ctx.lineTo(uLane, H);
                ctx.stroke();
            });

            // Center Road Dashed Divider Line (y = 0)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.30)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([16, 20]);
            ctx.lineDashOffset = -dashOffsetPx;
            ctx.beginPath();
            ctx.moveTo(u0, 0); ctx.lineTo(u0, H);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.lineDashOffset = 0;

            // Longitudinal Distance Markers
            ctx.font = '10px ui-monospace, Consolas, monospace';
            [10, 20, 30, 40, 50].forEach(dM => {
                const vLine = v0 - dM * scale;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(roadLeft, vLine);
                ctx.lineTo(roadRight, vLine);
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.fillText(`+${dM}m`, roadRight + 8, vLine + 3);
            });

            // Draw Ego Vehicle with dynamic steering & lateral motion
            const egoPixelX = u0 - egoLateralM * scale;
            drawEgoCar(ctx, egoPixelX, v0, egoHeadingDeg);

            // Draw Surrounding Obstacles
            if (rec && rec.radar_targets) {
                rec.radar_targets.forEach(tgt => {
                    const isMoving = Math.abs(tgt.vr) > 0.5;
                    const pu = u0 - tgt.y * scale;
                    const pv = v0 - tgt.x * scale;

                    if (pu >= 10 && pu < W - 10 && pv >= 10 && pv < H - 10) {
                        drawSurroundingVehicle(ctx, pu, pv, tgt, isMoving);
                    }
                });
            }
        }

        function drawEgoCar(ctx, x, y, headingDeg) {
            const carW = 20;
            const carL = 40;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate((headingDeg * Math.PI) / 180.0);

            // Car Body
            ctx.fillStyle = '#2563eb';
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(-carW / 2, -carL / 2, carW, carL, 4);
            ctx.fill();
            ctx.stroke();

            // Windshield
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-carW / 2 + 2, -carL / 2 + 6, carW - 4, 7);

            // Forward Direction Arrow
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -carL / 2 - 7);
            ctx.lineTo(-4, -carL / 2 - 1);
            ctx.lineTo(4, -carL / 2 - 1);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawSurroundingVehicle(ctx, x, y, tgt, isMoving) {
            const cls = (tgt.class || '').toLowerCase();
            let boxW = 20;
            let boxL = 36;
            let fillColor = 'rgba(59, 130, 246, 0.25)';
            let strokeColor = '#3b82f6';
            let labelText = 'Car';

            if (cls.includes('truck') || cls.includes('bus')) {
                boxW = 24;
                boxL = 52;
                fillColor = 'rgba(245, 158, 11, 0.25)';
                strokeColor = '#f59e0b';
                labelText = 'Truck/Bus';
            } else if (cls.includes('two') || cls.includes('bike') || cls.includes('motor')) {
                boxW = 12;
                boxL = 22;
                fillColor = 'rgba(16, 185, 129, 0.25)';
                strokeColor = '#10b981';
                labelText = 'Two-Wheeler';
            } else if (cls.includes('pedestrian') || cls.includes('person') || cls.includes('human')) {
                boxW = 12;
                boxL = 12;
                fillColor = 'rgba(239, 68, 68, 0.25)';
                strokeColor = '#ef4444';
                labelText = 'Human';
            } else if (cls.includes('auto')) {
                boxW = 16;
                boxL = 26;
                fillColor = 'rgba(234, 179, 8, 0.25)';
                strokeColor = '#eab308';
                labelText = 'Auto';
            }

            ctx.save();
            ctx.translate(x, y);

            // Bounding Box
            ctx.fillStyle = fillColor;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(-boxW / 2, -boxL / 2, boxW, boxL, 3);
            ctx.fill();
            ctx.stroke();

            // Doppler Velocity Vector Arrow (Only for moving vehicles)
            if (isMoving) {
                const vecLen = Math.min(32, Math.abs(tgt.vr) * 2.5);
                const isClosing = tgt.vr < 0;
                const vColor = isClosing ? '#ef4444' : '#10b981';

                ctx.strokeStyle = vColor;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                const endY = isClosing ? vecLen : -vecLen;
                ctx.lineTo(0, endY);
                ctx.stroke();

                ctx.fillStyle = vColor;
                ctx.beginPath();
                ctx.moveTo(0, endY);
                ctx.lineTo(-3, endY - (isClosing ? 4 : -4));
                ctx.lineTo(3, endY - (isClosing ? 4 : -4));
                ctx.closePath();
                ctx.fill();
            }

            // Target Class & Distance Label (e.g. "Car · 14.2m", "Human · 7.5m")
            ctx.font = '600 10px Inter, -apple-system, sans-serif';
            ctx.fillStyle = '#f8fafc';
            ctx.textAlign = 'center';
            ctx.fillText(`${labelText} · ${tgt.dist.toFixed(1)}m`, 0, -boxL / 2 - 5);

            ctx.restore();
        }

        // Playback Controls
        function startPlayback() {
            if (playbackInterval) clearInterval(playbackInterval);
            playbackInterval = setInterval(() => {
                let next = currentFrameIdx + 1;
                if (next >= totalFrames) next = 0;
                updateDashboard(next);
            }, (1000 / fps) / speedMultiplier);
            isPlaying = true;
            document.getElementById('btn-play').innerText = "Pause";
        }

        function pausePlayback() {
            if (playbackInterval) clearInterval(playbackInterval);
            playbackInterval = null;
            isPlaying = false;
            document.getElementById('btn-play').innerText = "Play";
        }

        function togglePlayback() {
            if (isPlaying) pausePlayback();
            else startPlayback();
        }

        function stepFrame(delta) {
            pausePlayback();
            updateDashboard(currentFrameIdx + delta);
        }

        function onScrub(val) {
            pausePlayback();
            updateDashboard(parseInt(val, 10));
        }

        function setSpeed(mult, btnEl) {
            document.querySelectorAll('.speed-opt').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            speedMultiplier = mult;
            if (isPlaying) startPlayback();
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayback();
            } else if (e.code === 'ArrowRight') {
                stepFrame(1);
            } else if (e.code === 'ArrowLeft') {
                stepFrame(-1);
            }
        });
    </script>
</body>
</html>
